<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeAI Creator Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030712;
      --surface-color: #111827;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --accent: #e11d48;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Landing Page Grid Theme */
    .hero-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 20%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 20%, black 40%, transparent 100%);
      pointer-events: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--surface-color);
      padding: 20px 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .brand-icon svg {
      width: 18px;
      height: 18px;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Auth State */
    #auth-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 20px;
      text-align: center;
    }

    #auth-view h1 { font-size: 24px; }
    #auth-view p { color: var(--text-secondary); }
    
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    #admin-view {
      display: none;
      flex-direction: column;
      gap: 30px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .metric-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-label {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 42px;
      font-weight: 700;
      color: white;
    }

    .table-container {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    th {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #374151;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    
    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
      font-weight: 500;
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Landing Page Background Mesh -->
  <div class="hero-grid"></div>

  <div class="loading-overlay" id="loading">Checking access...</div>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      ForgeAI Creator Portal
    </div>
    <div id="header-user" class="hidden" style="display: flex; align-items: center; gap: 16px;">
      <span style="color: var(--text-secondary); font-size: 14px;" id="admin-email"></span>
      <button class="btn" style="background: transparent; border: 1px solid var(--border-color);" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Auth Screen -->
    <div id="auth-view">
      <h1>Creator Access Restricted</h1>
      <p>Please sign in with your admin Google account to access metrics.</p>
      <button class="btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.86C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.05H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.95l3.66-2.86z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.86c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-view">
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Total Users</div>
          <div class="metric-value" id="metric-users">-</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Total Projects Generated</div>
          <div class="metric-value" id="metric-projects">-</div>
        </div>
      </div>

      <div class="table-container">
        <div class="table-header">Registered Users</div>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>User ID</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr><td colspan="3" style="text-align: center; color: var(--text-secondary);">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>
  
  <script src="firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
